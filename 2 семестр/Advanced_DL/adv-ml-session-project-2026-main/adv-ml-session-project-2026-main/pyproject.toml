[project]
name = "adv-ml-gtzan"
version = "0.1.0"
description = "Сравнение MLP, CNN и EfficientNet для классификации музыкальных жанров (GTZAN)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scikit-learn>=1.4",
    "pillow>=10.0",
    "kagglehub>=0.3,<1.0.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
]

[tool.uv]
package = false
